global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    app: warzone-backend
    env: production

scrape_configs:
  # Warzone backend — /metrics endpoint (prom-client)
  - job_name: warzone-backend
    static_configs:
      - targets: ['backend:3300']
    metrics_path: /metrics
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Redis (if you add redis_exporter later)
  # - job_name: redis
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

# Alert rules (optional — create alerts/warzone.yml to enable)
# rule_files:
#   - "alerts/*.yml"
