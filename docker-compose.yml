version: "3.9"

# Warzone Warriors — observability stack
# Starts Prometheus + Grafana + Redis alongside the backend.
#
# Quick start:
#   docker compose up -d
#
# Then:
#   Grafana:    http://localhost:3000  (admin / admin — change on first login)
#   Prometheus: http://localhost:9090
#   Backend:    http://localhost:3300
#   Metrics:    http://localhost:3300/metrics
#
# For production, restrict /metrics to internal network only (e.g., nginx allow 10.0.0.0/8).

services:
  # ── Warzone Backend ────────────────────────────────────────────────────────
  backend:
    build: .
    ports:
      - "3300:3300"
    environment:
      NODE_ENV: production
      PORT: 3300
      REDIS_URL: redis://redis:6379
      # Copy remaining vars from your .env file or use Docker secrets
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      ZG_RPC_URL: ${ZG_RPC_URL:-https://evmrpc.0g.ai}
      ZG_CHAIN_ID: ${ZG_CHAIN_ID:-16661}
      ZG_ANCHOR_CONTRACT_ADDRESS: ${ZG_ANCHOR_CONTRACT_ADDRESS}
      ZG_STORAGE_PRIVATE_KEY: ${ZG_STORAGE_PRIVATE_KEY}
      ZG_CHAIN_PRIVATE_KEY: ${ZG_CHAIN_PRIVATE_KEY}
      ZG_INDEXER_RPC: ${ZG_INDEXER_RPC:-https://indexer-storage-turbo.0g.ai}
      ZG_DA_DISPERSER: ${ZG_DA_DISPERSER:-disperser-testnet.0g.ai:51001}
      ZG_COMPUTE_API_KEY: ${ZG_COMPUTE_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3300/warzone/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Redis (shared rate limiter) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
